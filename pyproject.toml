[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textcraft-utils"
version = "0.0.1"
authors = [
  { name = "Ushodaya Kilari", email = "23mh1a05h8@acoe.edu.in" }
]
description = "A robust modern Python text processing and manipulation utility library."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
]
keywords = ["text", "slugify", "utilities", "formatting", "pypi", "cicd"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "build>=1.0",
  "twine>=4.0",
]

[project.urls]
"Homepage" = "https://github.com/USHODAYA/TestPyPI-with-a-CI-CD-Pipeline"
"Bug Tracker" = "https://github.com/USHODAYA/TestPyPI-with-a-CI-CD-Pipeline/issues"
"Documentation" = "https://github.com/USHODAYA/TestPyPI-with-a-CI-CD-Pipeline#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=textcraft_utils --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
